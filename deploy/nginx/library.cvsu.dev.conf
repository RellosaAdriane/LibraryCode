server {
    listen 80;
    listen [::]:80;
    server_name library.cvsu.dev;
    root /var/www/librarycode/build;
    index index.html index.htm;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    access_log /var/log/nginx/library.cvsu.dev.access.log;
    error_log /var/log/nginx/library.cvsu.dev.error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://*.gstatic.com 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: https:; connect-src 'self' https://accounts.google.com; frame-src https://accounts.google.com; base-uri 'self'; frame-ancestors 'none'" always;

    # Proxy only known API endpoints and php scripts used by the frontend
    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/librarycode/server$fastcgi_script_name;
    }

    location ^~ /server/ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/librarycode$fastcgi_script_name;
    }

    # Frontend references these php scripts directly; restrict proxying to them only
    location ~ ^/(login|register|reset-password|change-password|signup-settings|penalty-settings|announcement-settings|borrow|sso-settings|sso-login|google-config|google-auth|admin-2fa-settings|sessions|users|books|book-qr|book-cover|student-activity|security-logs|phil_time|health)\.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/librarycode/server$fastcgi_script_name;
    }

    # (No catch-all .php rule here — explicit php endpoints and /api/ are proxied)

    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /manifest.json {
        add_header Cache-Control "public, max-age=3600";
        try_files /manifest.json =404;
    }

    location / {
        try_files $uri $uri/ @spa;
    }

    location @spa {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }
}

# HTTPS server block using Let's Encrypt certs
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name library.cvsu.dev;
    root /var/www/librarycode/build;
    index index.html index.htm;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    ssl_certificate /etc/letsencrypt/live/library.cvsu.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/library.cvsu.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/library.cvsu.dev.ssl.access.log;
    error_log /var/log/nginx/library.cvsu.dev.ssl.error.log;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://*.gstatic.com 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: https:; connect-src 'self' https://accounts.google.com; frame-src https://accounts.google.com; base-uri 'self'; frame-ancestors 'none'" always;

    # reuse the same proxy rules for API/php endpoints
    location /api/ { include fastcgi_params; fastcgi_pass unix:/run/php/php8.5-fpm.sock; fastcgi_index index.php; fastcgi_param SCRIPT_FILENAME /var/www/librarycode/server$fastcgi_script_name; }
    location /server/ { include fastcgi_params; fastcgi_pass unix:/run/php/php8.5-fpm.sock; fastcgi_index index.php; fastcgi_param SCRIPT_FILENAME /var/www/librarycode$fastcgi_script_name; }
    location ~ ^/(login|register|reset-password|change-password|signup-settings|penalty-settings|announcement-settings|borrow|sso-settings|sso-login|google-config|google-auth|admin-2fa-settings|sessions|users|books|book-qr|book-cover|student-activity|security-logs|phil_time|health)\.php$ { include fastcgi_params; fastcgi_pass unix:/run/php/php8.5-fpm.sock; fastcgi_index index.php; fastcgi_param SCRIPT_FILENAME /var/www/librarycode/server$fastcgi_script_name; }
    # (No catch-all .php rule here — explicit php endpoints and /api/ are proxied)

    location = /index.html { add_header Cache-Control "no-cache"; try_files /index.html =404; }
    location ^~ /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    location = /manifest.json { add_header Cache-Control "public, max-age=3600"; try_files /manifest.json =404; }
    location / { try_files $uri $uri/ @spa; }
    location @spa { add_header Cache-Control "no-cache"; try_files /index.html =404; }
}
