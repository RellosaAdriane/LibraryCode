version: '3.8'

services:
  frontend:
    image: node:18
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: sh -c "npm install && npm start"

  backend:
    image: php:8.1-apache
    volumes:
      - ./server:/var/www/html
    ports:
      - "8000:80"
